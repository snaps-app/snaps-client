name: CI
on:
  pull_request:
  push:
    branches: [main, sprint-24.5, 'feature/**']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SNAPS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --config vitest.browser.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: snaps-client-0.2.0-${{ github.sha }}
          path: dist/
          if-no-files-found: error
